<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Brachistochrone trajectory icon</title>
  <desc id="desc">A spacecraft follows a curved accelerating and decelerating path around a midpoint marker.</desc>
  <defs>
    <linearGradient id="bg" x1="48" y1="38" x2="452" y2="474" gradientUnits="userSpaceOnUse">
      <stop stop-color="#102a48"/>
      <stop offset="1" stop-color="#06101d"/>
    </linearGradient>
    <linearGradient id="path" x1="82" y1="350" x2="430" y2="144" gradientUnits="userSpaceOnUse">
      <stop stop-color="#74a8ff"/>
      <stop offset="0.52" stop-color="#67e8c7"/>
      <stop offset="1" stop-color="#74a8ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="174" fill="none" stroke="#9fb0c9" stroke-opacity=".12" stroke-width="2"/>
  <circle cx="256" cy="256" r="118" fill="none" stroke="#9fb0c9" stroke-opacity=".09" stroke-width="2"/>
  <path d="M74 358C138 358 141 146 256 146s118 212 182 212" fill="none" stroke="#67e8c7" stroke-opacity=".15" stroke-width="34" stroke-linecap="round"/>
  <path d="M74 358C138 358 141 146 256 146s118 212 182 212" fill="none" stroke="url(#path)" stroke-width="15" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M256 104v284" stroke="#67e8c7" stroke-opacity=".48" stroke-width="5" stroke-dasharray="10 14" stroke-linecap="round"/>
  <circle cx="256" cy="146" r="23" fill="#07111f" stroke="#67e8c7" stroke-width="10"/>
  <path d="m229 147-61-31 20 33-20 33 61-31c5-2 5-2 0-4Z" fill="#f3f7ff"/>
  <path d="M167 149h-35" stroke="#74a8ff" stroke-width="10" stroke-linecap="round"/>
  <path d="M375 354h62" stroke="#74a8ff" stroke-width="10" stroke-linecap="round"/>
  <circle cx="74" cy="358" r="18" fill="#74a8ff"/>
  <circle cx="438" cy="358" r="18" fill="#74a8ff"/>
